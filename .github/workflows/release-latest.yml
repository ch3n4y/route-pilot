name: Build latest release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "显示在应用和 Release 标题中的版本号"
        required: true
        default: "latest"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build web assets
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Test and build Windows executable
        shell: pwsh
        env:
          APP_VERSION: ${{ inputs.version }}
          CGO_ENABLED: 0
        run: |
          go test ./...
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -ldflags "-s -w -H=windowsgui -X main.version=$env:APP_VERSION" -o "dist/RoutePilot.exe" .

      - name: Compress executable with UPX
        shell: pwsh
        run: |
          choco install upx -y --no-progress
          upx --best --lzma "dist/RoutePilot.exe"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoutePilot-${{ inputs.version }}
          path: dist/RoutePilot.exe
          if-no-files-found: error

      - name: Replace GitHub latest release
        shell: pwsh
        env:
          # 优先使用可选的 fine-grained PAT；未配置时使用 Actions 的 GITHUB_TOKEN。
          # PAT secret 名称：RELEASE_TOKEN（Contents: Read and write）。
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          APP_VERSION: ${{ inputs.version }}
        run: |
          # 删除所有既有 Release；保留其 tag，避免误删用户手工创建的标签。
          $releaseJSON = gh api --paginate "repos/$env:REPOSITORY/releases"
          if ($LASTEXITCODE -ne 0) {
            throw "无法管理 GitHub Releases：请在仓库 Settings > Actions > General > Workflow permissions 启用 Read and write permissions；或者配置 RELEASE_TOKEN secret。"
          }
          $releases = $releaseJSON | ConvertFrom-Json
          foreach ($release in $releases) {
            gh api --method DELETE "repos/$env:REPOSITORY/releases/$($release.id)"
            if ($LASTEXITCODE -ne 0) { throw "删除旧 Release 失败：$($release.tag_name)" }
          }

          # latest 是固定 tag，因此每次手动发布都会覆盖为当前提交。
          gh api "repos/$env:REPOSITORY/git/ref/tags/latest" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh api --method DELETE "repos/$env:REPOSITORY/git/refs/tags/latest"
            if ($LASTEXITCODE -ne 0) { throw "删除旧 latest tag 失败" }
          }
          gh release create latest "dist/RoutePilot.exe" `
            --repo "$env:REPOSITORY" `
            --target "$env:COMMIT_SHA" `
            --title "RoutePilot $env:APP_VERSION" `
            --notes "由 GitHub Actions 手动构建：$env:COMMIT_SHA" `
            --latest
          if ($LASTEXITCODE -ne 0) { throw "创建 latest Release 失败" }
